components:
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
              description: "Stable machine-readable code (see each endpoint)."
            message:
              type: "string"
              description: "A sentence for people."
          required:
            ["code", "message"]
        existing:
          "$ref": "#/components/schemas/Card"
        point:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
          required:
            ["lat", "lng"]
      required:
        ["error"]
      description: "Every error. Some carry more fields: `existing` (the card of the code already there) on 409 exists, `point` on a spot with no compound."
    Zone:
      type: "object"
      properties:
        key:
          type: "string"
          example: "1LV"
        name:
          type: "string"
          example: "Libreville"
        region:
          type: "string"
          example: "GA-1"
        index:
          type: "integer"
          description: "Frozen index under the check digit, 0-48."
    AreaBrief:
      type: "object"
      properties:
        key:
          type: "string"
          example: "1LV-070"
        id:
          type: "integer"
        plateName:
          type: "string"
        officialName:
          type: "string"
        provisionalName:
          type: "boolean"
        zone:
          type: "string"
        zoneName:
          type: "string"
    Record:
      type: "object"
      properties:
        machine:
          type: "string"
        home:
          type: "string"
        written:
          type: "string"
        zone:
          type: "string"
        official_name:
          type: "string"
        number:
          type: "string"
        check:
          type: "string"
        status:
          type: "string"
        issued:
          type: "string"
        issued_at:
          type: "string"
        entrance_lat:
          type: "string"
        entrance_lng:
          type: "string"
        entrance_kind:
          type: "string"
        spot_code:
          type: "string"
        official_address:
          type: "string"
        class:
          type: "string"
        use:
          type: "string"
        kind:
          type: "string"
        structures:
          type: "string"
        floor_area_m2:
          type: "string"
        rule:
          type: "string"
        estate:
          type: "string"
      description: "The registry row exactly as published (registry/<zone>.csv.gz), every column as text."
    Card:
      type: "object"
      properties:
        country:
          type: "string"
          const: "GA"
        machine:
          type: "string"
          description: "Machine form, with its check digit."
          example: "GA-1LV-070-1201-1"
        home:
          type: "string"
          example: "Louis 1201"
        written:
          type: "string"
          description: "The remembered form as written on a plate."
          example: "Louis 12 01"
        spoken:
          type: "string"
          example: "Louis, 12 01"
        number:
          type: "integer"
        check:
          type: "integer"
          minimum: 0
          maximum: 9
        status:
          type: "string"
          enum:
            ["provisional", "confirmed", "retired"]
        issued:
          type: "string"
          enum:
            ["bulk", "on-demand"]
        issuedAt:
          type: "string"
          format: "date-time"
        area:
          "$ref": "#/components/schemas/AreaBrief"
        zone:
          "$ref": "#/components/schemas/Zone"
        officialAddress:
          type:
            ["string", "null"]
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum:
                ["centre", "gate", "door"]
        spotCode:
          type: "string"
          example: "GA-1LV E0794 N0757"
        plusCode:
          type: "string"
          example: "6FGFCC5J+CH2"
        profile:
          type: "object"
          properties:
            class:
              type: "string"
            use:
              type: "string"
            kind:
              type: "string"
            structures:
              type: "integer"
            floorAreaM2:
              type: "number"
            rule:
              type:
                ["string", "null"]
            estate:
              type:
                ["string", "null"]
        record:
          "$ref": "#/components/schemas/Record"
        credit:
          type: "string"
        newBlocks:
          type: "array"
          items:
            type: "array"
            items:
              type: "integer"
            minItems: 2
            maxItems: 2
          description: "POST only: blocks of the name range this issue opened."
      required:
        ["machine", "home", "written", "status", "record"]
    Brief:
      type: "object"
      properties:
        machine:
          type: "string"
        home:
          type: "string"
        written:
          type: "string"
        status:
          type: "string"
        area:
          type: "string"
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
          required:
            ["lat", "lng"]
        officialAddress:
          type: "string"
        distanceM:
          type: "number"
    Health:
      type: "object"
      properties:
        status:
          type: "string"
          const: "ok"
        country:
          type: "string"
        codes:
          type: "integer"
        registryExported:
          type: "string"
          format: "date-time"
        issuing:
          type: "boolean"
    Info:
      type: "object"
      properties:
        country:
          type: "string"
        name:
          type: "string"
        codes:
          type: "integer"
        byStatus:
          type: "object"
          properties: {}
          additionalProperties:
            type: "integer"
        byIssue:
          type: "object"
          properties: {}
          additionalProperties:
            type: "integer"
        zones:
          type: "array"
          items:
            type: "object"
            properties:
              key:
                type: "string"
              name:
                type: "string"
              region:
                type: "string"
              codes:
                type: "integer"
              areas:
                type: "integer"
        areas:
          type: "integer"
        areasWithCodes:
          type: "integer"
        names:
          type: "integer"
        registryExported:
          type: "string"
        importedAt:
          type: "string"
        engine:
          type: "string"
        spec:
          type: "string"
        licences:
          type: "object"
          properties: {}
          additionalProperties:
            type: "string"
        credit:
          type: "string"
        creditUrl:
          type: "string"
        issuing:
          type: "boolean"
        issuePerDay:
          type:
            ["integer", "null"]
        example:
          type: "object"
          properties: {}
          additionalProperties:
            type: "string"
    Find:
      type: "object"
      properties:
        query:
          type: "string"
        kind:
          type: "string"
          enum:
            ["remembered", "machine", "officialAddress", "spot"]
        checked:
          type: "boolean"
        matches:
          type: "array"
          items:
            "$ref": "#/components/schemas/Card"
        total:
          type: "integer"
    At:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            ["found", "none"]
        code:
          "$ref": "#/components/schemas/Card"
        distanceM:
          type: "number"
        canIssue:
          type: "boolean"
        area:
          "$ref": "#/components/schemas/AreaBrief"
        nearest:
          "$ref": "#/components/schemas/Brief"
    Near:
      type: "object"
      properties:
        point:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
          required:
            ["lat", "lng"]
        radiusM:
          type: "number"
        total:
          type: "integer"
        codes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Brief"
    Verify:
      type: "object"
      properties:
        code:
          type: "string"
        syntax:
          type: "boolean"
        checkDigit:
          type:
            ["string", "null"]
          enum:
            ["ok", "wrong", "absent", null]
        inBlocks:
          type:
            ["boolean", "null"]
        valid:
          type: "boolean"
        issued:
          type: "boolean"
        area:
          type: "string"
        status:
          type: "string"
        machine:
          type: "string"
        home:
          type: "string"
        reason:
          type: "string"
    Spot:
      type: "object"
      properties:
        spot:
          type: "string"
        zone:
          "$ref": "#/components/schemas/Zone"
        cellM:
          type: "integer"
        centre:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
          required:
            ["lat", "lng"]
    SpotDecode:
      type: "object"
      properties:
        spot:
          type: "string"
        zone:
          "$ref": "#/components/schemas/Zone"
        centre:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
          required:
            ["lat", "lng"]
        cellM:
          type: "integer"
        code:
          oneOf:
            - "$ref": "#/components/schemas/Brief"
            - type: "null"
    Zones:
      type: "object"
      properties:
        zones:
          type: "array"
          items:
            type: "object"
            properties:
              key:
                type: "string"
              index:
                type: "integer"
              name:
                type: "string"
              region:
                type: "string"
              codes:
                type: "integer"
              areas:
                type: "integer"
        total:
          type: "integer"
    ZoneDetail:
      type: "object"
      properties:
        key:
          type: "string"
        name:
          type: "string"
        region:
          type: "string"
        index:
          type: "integer"
        frame:
          type: "object"
          properties:
            lon0:
              type: "number"
            lat0:
              type: "number"
            latc:
              type: "number"
            digitsE:
              type: "integer"
            digitsN:
              type: "integer"
        codes:
          type: "integer"
        areas:
          type: "array"
          items:
            allOf:
              - "$ref": "#/components/schemas/AreaBrief"
              - type: "object"
                properties:
                  codes:
                    type: "integer"
                  blocks:
                    type: "array"
                    items:
                      type: "array"
                      items:
                        type: "integer"
    Page:
      type: "object"
      properties:
        zone:
          type: "string"
        codes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Brief"
        count:
          type: "integer"
        next:
          type:
            ["string", "null"]
    Area:
      allOf:
        - "$ref": "#/components/schemas/AreaBrief"
        - type: "object"
          properties:
            index:
              type: "string"
            nameKey:
              type: "string"
            nameId:
              type: "integer"
            digits:
              type: "integer"
            blocks:
              type: "array"
              items:
                type: "array"
                items:
                  type: "integer"
            codes:
              type: "integer"
            compoundsAtFirstIssue:
              type: "integer"
            place:
              oneOf:
                - type: "object"
                  properties:
                    lat:
                      type: "number"
                    lng:
                      type: "number"
                  required:
                    ["lat", "lng"]
                - type: "null"
            frame:
              type: "array"
              items:
                type: "number"
            alertZone:
              type: "boolean"
            nameRange:
              type: "object"
              properties:
                range:
                  type: "array"
                  items:
                    type: "integer"
                spareFrom:
                  type: "integer"
                areas:
                  type: "array"
                  items:
                    type: "string"
    AreasNamed:
      type: "object"
      properties:
        name:
          type: "string"
        total:
          type: "integer"
        areas:
          type: "array"
          items:
            allOf:
              - "$ref": "#/components/schemas/AreaBrief"
              - type: "object"
                properties:
                  codes:
                    type: "integer"
                  blocks:
                    type: "array"
                    items:
                      type: "array"
                      items:
                        type: "integer"
    IssueRequest:
      type: "object"
      properties:
        lat:
          type: "number"
        lng:
          type: "number"
        outline:
          type: "array"
          items:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 2
          minItems: 3
          maxItems: 500
          description: "The building outline, [lng, lat] points; its area must be 6 m² to 2 ha."
        of:
          type: "string"
          description: "Machine code of the compound this is another door of (within 80 m of its entrance)."
      required:
        ["lat", "lng"]
    ChangeRequest:
      type: "object"
      properties:
        status:
          type: "string"
          enum:
            ["provisional", "confirmed", "retired"]
        entrance:
          type: "object"
          properties:
            lat:
              type: "number"
            lng:
              type: "number"
            kind:
              type: "string"
              enum:
                ["gate", "door"]
              default: "gate"
          required:
            ["lat", "lng"]
          description: "The new entrance, at most 80 m from the old one, and never more than 300 m outside Gabon's national border (422 outside)."
  securitySchemes:
    issuingKey:
      type: "http"
