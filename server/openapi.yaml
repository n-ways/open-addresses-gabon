# OpenAPI 3.1 description of the registry API of N-Ways Addressing for Gabon (server/).
# Every example is a real response of the server on the published registry (docs/api.md).
openapi: "3.1.0"
info:
  title: "N-Ways Addressing for Gabon: registry API"
  version: "1.0.0"
  description: "The API of the registry server in server/: every published code of Gabon, look-ups by remembered form, machine form, official address, spot code and point, and on-demand issue by the rules of engine/SPEC.md. Every response is JSON; every error is {\"error\": {\"code\", \"message\"}}. Data: ODbL 1.0; credit \"N-Ways Addressing for Gabon, © N-WAYS LIMITED (nways.ng)\"."
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
  contact:
    name: "N-WAYS LIMITED"
    url: "https://nways.ng"
    email: "hello@nways.ng"
servers:
  - url: "http://localhost:8080"
    description: "A local deployment (docker compose up)"
paths:
  "/v1/health":
    get:
      summary: "Liveness and the registry served"
      operationId: "health"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
              example:
                status: "ok"
                country: "GA"
                codes: 665089
                registryExported: "2026-10-21T07:46:20Z"
                issuing: true
        "404":
          description: "Not an endpoint"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: "not_found"
                  message: "There is no endpoint /v1/codez; see /v1/info and docs/api.md."
        "405":
          description: "Method not allowed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: "method_not_allowed"
                  message: "DELETE is not allowed here; use GET."
      security: []
  "/v1/info":
    get:
      summary: "Country, zones, counts, licences, credit, engine"
      operationId: "info"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Info"
              example:
                country: "GA"
                name: "Gabon"
                codes: 665089
                byStatus:
                  provisional: 665089
                byIssue:
                  bulk: 665089
                zones:
                  - key: "1KG"
                    name: "Komo"
                    region: "GA-1"
                    codes: 8527
                    areas: 205
                  - key: "1KM"
                    name: "Komo-Mondah"
                    region: "GA-1"
                    codes: 123489
                    areas: 109
                  - key: "1KO"
                    name: "Komo-Ocèan"
                    region: "GA-1"
                    codes: 1452
                    areas: 51
                areas: 4922
                areasWithCodes: 2932
                names: 3737
                registryExported: "2026-10-21T07:46:20Z"
                importedAt: "2026-10-21T13:57:15Z"
                engine: "internal/addressing/ga (SPEC v1.0)"
                spec: "engine/SPEC.md"
                licences:
                  data: "ODbL 1.0 (LICENSE-DATA)"
                  code: "Apache-2.0 (LICENSE)"
                  documents: "CC BY 4.0 (LICENSE-DOCS)"
                credit: "N-Ways Addressing for Gabon, © N-WAYS LIMITED (nways.ng)"
                creditUrl: "https://github.com/n-ways/open-addresses-gabon"
                issuing: true
                issuePerDay: 50
                example:
                  remembered: "Louis 12 01"
                  machine: "GA-1LV-070-1201-1"
                  spot: "GA-1LV E0794 N0757"
        "404":
          description: "Not an endpoint"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: "not_found"
                  message: "There is no endpoint /v1/codez; see /v1/info and docs/api.md."
        "405":
          description: "Method not allowed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                error:
                  code: "method_not_allowed"
                  message: "DELETE is not allowed here; use GET."
      security: []
